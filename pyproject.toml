[project]
name = "repolens"
version = "1.0.0"
description = "Enterprise Autonomous AI Codebase Intelligence, AST Analysis & Git Evolution Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-groq>=0.1.0",
    "groq>=0.5.0",
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.8.0",
    "chromadb>=0.4.24",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "gitpython>=3.1.40",
    "duckduckgo-search>=5.3.0",
    "ddgs>=9.14.0",
    "psycopg[binary,pool]>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
